name: Rust Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: rust-check-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cargo-check:
    name: cargo check
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git --depth 1 --branch 2026.05.25 C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg') }}

      - name: Install libheif (vcpkg)
        run: C:\vcpkg\vcpkg.exe install "libheif[core]:x64-windows-static-md"
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: 'files,C:\vcpkg-cache,readwrite'

      - name: Copy pdfium dll
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $srcFile = "pdfium-$arch.dll"
          if (-not (Test-Path -LiteralPath $srcFile)) {
            Write-Host "[copy-pdfium-dll] $srcFile not found, skipping"
            exit 0
          }
          $targetDir = "src-tauri/dlls"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -LiteralPath $srcFile -Destination (Join-Path $targetDir 'pdfium.dll') -Force
          Write-Host "[copy-pdfium-dll] $srcFile -> $targetDir/pdfium.dll"
        shell: pwsh

      - name: Cargo check
        run: |
          cargo --version
          cargo check --locked --all-targets
        env:
          VCPKG_ROOT: C:\vcpkg

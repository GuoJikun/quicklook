name: Publish to WinGet

on:
  workflow_run:
    workflows: ["PublishApp"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Get latest release tag
        id: get_release_tag
        run: |
          $Releases = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=1" `
            -Headers @{ Authorization = "token $env:GITHUB_TOKEN" }
          $Latest = $Releases | Where-Object { -not $_.draft } | Select-Object -First 1
          Write-Output "tag=$($Latest.tag_name)" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: GuoJikun.QuickLook
          installers-regex: '_x64-setup\.exe$|_arm64-setup\.exe$'
          release-tag: ${{ steps.get_release_tag.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

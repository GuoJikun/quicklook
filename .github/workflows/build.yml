name: PublishApp
on:
  push:
    tags:
      - v*

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust-target: "x86_64-pc-windows-msvc"
            triplet: "x64-windows-static-md"
            target: "windows"
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust-target: "aarch64-pc-windows-msvc"
            triplet: "arm64-windows-static-md"
            target: "windows-aarch64"

    runs-on: ${{ matrix.settings.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add Rust targets window aarch64
        if: matrix.settings.target == 'windows-aarch64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Extract release notes from CHANGELOG
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = context.ref.replace(/^refs\/tags\/v/, '');
            const repo = context.repo.owner + '/' + context.repo.repo;
            let body = `See [CHANGELOG.md](https://github.com/${repo}/blob/main/CHANGELOG.md) for details.`;
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`##\\s*v${escaped}\\b[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`);
              const matched = changelog.match(re);
              if (matched && matched[1].trim()) {
                body = matched[1].trim();
              } else {
                core.warning(`CHANGELOG.md has no section for v${version}`);
              }
            } catch (e) {
              core.warning(`Failed to read CHANGELOG.md: ${e.message}`);
            }
            return body;

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git --depth 1 --branch 2026.05.25 C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ matrix.settings.triplet }}-${{ hashFiles('vcpkg') }}

      - name: Install libheif (vcpkg)
        run: C:\vcpkg\vcpkg.exe install "libheif[core]:${{ matrix.settings.triplet }}"
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: 'files,C:\vcpkg-cache,readwrite'

      - name: setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install

      - name: Write Sentry Token
        run: echo "VITE_SENTRY_TOKEN=${{ secrets.SENTRY_TOKEN }}" > ~/.env

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: C:\vcpkg
        with:
          args: ${{ matrix.settings.args }}
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: 'v__VERSION__'
          releaseBody: "${{ steps.release_notes.outputs.result }}"
          releaseDraft: false
          prerelease: true
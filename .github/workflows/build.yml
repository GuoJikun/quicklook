name: PublishApp
on:
  push:
    tags:
      - v*
  # 手动触发只做构建验证，不创建 Release（tagName 留空即可）
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
            arch: "x64"
            args: "--target x86_64-pc-windows-msvc"
            rust-target: "x86_64-pc-windows-msvc"
            target: "windows"
          - platform: windows-latest
            arch: "arm64"
            args: "--target aarch64-pc-windows-msvc"
            rust-target: "aarch64-pc-windows-msvc"
            target: "windows-aarch64"

    runs-on: ${{ matrix.settings.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 随包分发的是自行裁剪构建的 ffmpeg / ffprobe（见 scripts/build-ffmpeg.sh）：
      # 组件白名单、去掉 GPL 后的 h264_mf 兜底都是定制过的，不能改用官方预编译产物。
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # minimal 会保留外部 PATH，arm64 的 llvm-mingw 才能被 msys2 shell 找到
          path-type: minimal
          update: false
          install: >-
            base-devel
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm

      # arm64 在 x64 runner 上交叉编译：llvm-mingw 自带 aarch64-w64-mingw32-* 全套工具，
      # MSYS2 只有 x86_64 的 mingw-w64 工具链，装不出 aarch64 产物。
      # 解压到 RUNNER_TEMP，PATH 在构建步骤里显式拼（msys2 的 minimal PATH 不继承外部目录）。
      - name: Setup llvm-mingw (arm64 cross toolchain)
        if: matrix.settings.arch == 'arm64'
        shell: pwsh
        env:
          # 版本号只在这一处声明：解压目录名由它推导后写进 GITHUB_ENV，
          # 下游步骤不再硬编码，避免升级时两处不同步
          LLVM_MINGW_VERSION: "20261020"
        run: |
          $ver = $env:LLVM_MINGW_VERSION
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force

          # 解压目录名带版本号，这里解析出真实 bin 目录再下传；
          # 目录不存在直接失败，不能让下游在缺工具链时静默退回 x86_64 gcc
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw-$ver-ucrt-x86_64\bin"
          if (-not (Test-Path -LiteralPath $bin)) {
            throw "llvm-mingw bin 目录不存在: $bin"
          }
          "LLVM_MINGW_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 首次约 20 分钟，之后命中缓存只重编增量部分。
      # key 带上架构和脚本哈希：脚本里的白名单一改，旧的目标文件就不能再复用。
      - name: Cache ffmpeg build
        uses: actions/cache@v4
        with:
          path: .ffmpeg-build
          key: ffmpeg-${{ matrix.settings.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          restore-keys: |
            ffmpeg-${{ matrix.settings.arch }}-

      - name: Build bundled ffmpeg
        shell: msys2 {0}
        env:
          TARGET_ARCH: ${{ matrix.settings.arch }}
          # LLVM_MINGW_BIN 由上面的 llvm-mingw 步骤推导后写入 GITHUB_ENV，x64 架构下不存在。
          # msys2 的 minimal PATH 不继承外部目录，交叉工具链得在脚本里显式拼进 PATH。
        run: |
          # arm64 缺交叉工具链时绝不能继续：configure 会退回 PATH 里的 x86_64 gcc，
          # 产出 x64 二进制却命名为 aarch64，打包不校验架构，用户装上才闪退。
          if [[ "${TARGET_ARCH}" = "arm64" ]]; then
            if [[ -z "${LLVM_MINGW_BIN:-}" ]]; then
              echo "arm64 构建缺少 LLVM_MINGW_BIN（llvm-mingw 步骤未执行）" >&2
              exit 1
            fi
            mingw_bin="$(cygpath -u "$LLVM_MINGW_BIN")"
            if [[ ! -d "$mingw_bin" ]]; then
              echo "llvm-mingw bin 目录不存在: $LLVM_MINGW_BIN" >&2
              exit 1
            fi
            export PATH="$mingw_bin:$PATH"
          fi
          bash scripts/build-ffmpeg.sh

      - name: Add Rust targets window aarch64
        if: matrix.settings.target == 'windows-aarch64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Extract release notes from CHANGELOG
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = context.ref.replace(/^refs\/tags\/v/, '');
            const repo = context.repo.owner + '/' + context.repo.repo;
            let body = `See [CHANGELOG.md](https://github.com/${repo}/blob/main/CHANGELOG.md) for details.`;
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`##\\s*v${escaped}\\b[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`);
              const matched = changelog.match(re);
              if (matched && matched[1].trim()) {
                body = matched[1].trim();
              } else {
                core.warning(`CHANGELOG.md has no section for v${version}`);
              }
            } catch (e) {
              core.warning(`Failed to read CHANGELOG.md: ${e.message}`);
            }
            return body;

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install

      - name: Write Sentry Token
        run: echo "VITE_SENTRY_TOKEN=${{ secrets.SENTRY_TOKEN }}" > ~/.env

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.settings.args }}
          # 推 tag 时由 action 把 __VERSION__ 替换成包版本；手动触发时留空，
          # 只跑构建与打包，不创建 Release、不上传资产。
          tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
          releaseName: 'v__VERSION__'
          releaseBody: "${{ steps.release_notes.outputs.result }}"
          releaseDraft: false
          prerelease: true
name: Publish Release
on:
  push:
    tags:
      - v*

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust-target: "x86_64-pc-windows-msvc"
            triplet: "x64-windows-static-md"
            target: "windows"
            arch: "x64"
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust-target: "aarch64-pc-windows-msvc"
            triplet: "arm64-windows-static-md"
            target: "windows-aarch64"
            arch: "aarch64"

    runs-on: ${{ matrix.settings.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add Rust targets window aarch64
        if: matrix.settings.target == 'windows-aarch64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Get latest release
        id: get_release
        uses: actions/github-script@v4
        with:
          script: |
            const latestRelease = await github.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const notes = latestRelease.data.body || '没有更新信息';
            return notes;

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 暂时禁用：HEIC/HEIF 支持已禁用，不再需要 vcpkg 构建 libheif
      # - name: Install cargo-vcpkg
      #   run: cargo install cargo-vcpkg
      #
      # - name: Build vcpkg dependencies
      #   run: |
      #     if (-not (Test-Path "$env:GITHUB_WORKSPACE/target/vcpkg/installed/${{ matrix.settings.triplet }}")) {
      #       cargo vcpkg build --manifest-path crates/image/Cargo.toml --target ${{ matrix.settings.rust-target }}
      #     }
      #   shell: pwsh

      - name: setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install

      - name: Write Sentry Token
        run: echo "VITE_SENTRY_TOKEN=${{ secrets.SENTRY_TOKEN }}" > ~/.env

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # VCPKG_ROOT: ${{ github.workspace }}\target\vcpkg  # 暂时禁用：HEIC/HEIF 支持已禁用
        with:
          args: ${{ matrix.settings.args }}
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: 'v__VERSION__'
          releaseBody: "${{ steps.get_release.outputs.result }}"
          releaseDraft: false
          prerelease: true

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $arch = "${{ matrix.settings.arch }}"
          $stagingDir = "portable-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force

          Copy-Item "src-tauri/target/${{ matrix.settings.rust-target }}/release/app.exe" "$stagingDir/"
          Copy-Item "src-tauri/resources/config.json" "$stagingDir/"

          $zipName = "quicklook_${version}_${arch}-portable.zip"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_ZIP=$zipName"

      - name: Upload portable ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicklook-${{ matrix.settings.arch }}-portable
          path: ${{ env.PORTABLE_ZIP }}

      - name: Upload portable ZIP to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME $env:PORTABLE_ZIP